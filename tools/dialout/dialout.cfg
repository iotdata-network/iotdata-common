# dialout.cfg -- committed defaults for the dialout tool. Every key here is a default; nothing in
# this file is host-specific and nothing in it is secret.
#
# Per-host settings go in dialout.<hostname>.cfg, which is NOT committed (see .gitignore) and is
# read AFTER this file, overriding it key by key. That is the house pattern: a documented committed
# baseline plus an ignored local overlay, so a checkout is complete but never carries anyone's
# domain or credentials.
#
# Format: key=value, one per line, # for comments. Both dialout-server and dialout-client read the
# same file -- a box can be either end, and mostly the keys they each use are disjoint.

# ----------------------------------------------------------------------------------------------
# identity
# ----------------------------------------------------------------------------------------------

# Who this client calls itself. The name is what the reverse-tunnel port is derived from, so it
# must be stable and it must match what the server was told at enrol time. Empty = this host's
# hostname, which is usually what you want.
name=

# ----------------------------------------------------------------------------------------------
# service discovery -- how a client finds the server
# ----------------------------------------------------------------------------------------------
#
# The server publishes two records and the client reads them back:
#
#   _<dns-service>._tcp.<dns-domain>   SRV  0 0 <port-external> <dns-target>
#   <dns-target>                       A    <the server's public IP>
#
# SRV rather than a bare name because it carries the PORT as well as the host: the client learns
# where to dial without anything but the domain being configured, and the server can move host or
# port without touching a single client.

dns-domain=
dns-service=dialout
# empty = <dns-service>.<dns-domain>
dns-target=
dns-ttl=60

# ----------------------------------------------------------------------------------------------
# the invite list -- how a client knows whether anyone is actually waiting for it
# ----------------------------------------------------------------------------------------------
#
# A client that dials in when nobody is listening costs data, battery and log noise for nothing.
# So the server publishes a THIRD record, a TXT invite list, and the client reads it in the same
# breath as the SRV and exits before opening a single socket if it is not on it:
#
#   _<dns-service>-invite._tcp.<dns-domain>  TXT  "v=1 a1b2c3 d4e5f6:1757500000"
#
# The names are the same 6-hex-digit md5 token the tunnel port is derived from, not the names
# themselves: the list is public, and a public list of your field sites is nobody else's business.
# An entry may carry :<expiry-epoch>, after which it is ignored (and swept by the server). The
# single token * invites everyone, which is what you want while commissioning.
#
# `dialout-server wait --for <name>` writes an entry and removes it again on exit, so the screen
# session IS the invite -- there is nothing extra to remember to turn off.

# empty = _<dns-service>-invite._tcp.<dns-domain>
dns-invite=

# 1 = no invite, no dial (and no connection attempt at all). 0 = dial on every run regardless,
# which is the old always-on behaviour -- useful for a box you are actively bringing up.
require-invite=1

# ----------------------------------------------------------------------------------------------
# the endpoint itself
# ----------------------------------------------------------------------------------------------

# Where the dialout sshd listens on the server, and what the world sees. They differ only if
# something upstream is already translating; UPnP maps external -> internal.
port-internal=47022
port-external=47022

# The unix account clients log into on the server. Created by `dialout-server install`. It exists
# only to own an authorized_keys file -- it has no shell and no password.
#
# NOT "dialout": Debian already ships a group of that name (gid 20) for serial-port access, and an
# ssh account that landed in it would silently hand every client key access to /dev/tty*.
ssh-user=dialoutd

# ----------------------------------------------------------------------------------------------
# reverse-tunnel port allocation
# ----------------------------------------------------------------------------------------------
#
# Each client gets one port on the server's loopback that forwards back to its sshd. The port is
# DERIVED from the client name -- md5(name), first 6 hex digits, modulo the span -- so both ends
# compute the same number from the name alone, with nothing to register, distribute or keep in
# sync. `dialout-server clients` warns if two enrolled names collide; if they do, pin one with
# tunnel-port in that host's config (and the same value on the server).

tunnel-port-base=47100
tunnel-port-span=400
# explicit override for this client; empty = derive
tunnel-port=

# What the tunnel points at on the client. 22 unless the client's sshd is elsewhere.
local-port=22

# ----------------------------------------------------------------------------------------------
# client dial behaviour
# ----------------------------------------------------------------------------------------------

# Three things end a held tunnel, and none of them cuts off a session in progress.
#
# 1. THE INVITE IS WITHDRAWN. Ctrl-C out of `dialout-server wait` and the client notices within
#    invite-recheck seconds and hangs up -- so the tunnel lasts as long as someone is waiting on
#    it, not as long as a timer says. If a session is open it waits for that to finish first.
#    (A withdrawn record and a dead resolver look identical from the client, so it confirms DNS is
#    still answering before acting: a hiccup must not drop a working tunnel.)
#
# 2. IDLE -- nothing has used the tunnel for `idle` seconds. This is the backstop, not the main
#    mechanism: half an hour is deliberately generous because an invite that still stands means
#    someone still wants in, and they may be working on something else in between logins. What
#    stops that costing a 4G modem half an hour of power for nothing is (1), not a short timer.
#    "Used" means the tunnel is carrying an established connection, sampled every poll seconds.
#
# 3. hold-max, the absolute cap, busy or not. Keep it comfortably under the timer interval so two
#    runs can never overlap and fight over the same tunnel port.

idle=1800
poll=30
invite-recheck=60
hold-max=21600

# ----------------------------------------------------------------------------------------------
# the link hook -- for a box whose network IS the dial-out
# ----------------------------------------------------------------------------------------------
#
# A node with a 4G modem that is powered down between windows has no DNS to resolve over until
# something brings the modem up. So this script, if set, is called with "up" before anything else
# happens and "down" the moment the tunnel is finished -- including when the run ends early
# because there was no invitation, so an uninvited check costs seconds of modem, not minutes.
#
# Contract: $1 is "up" or "down"; exit 0 = success. A failed "up" aborts the run rather than
# dialing into a dead link. It must be idempotent, and "down" runs even if "up" failed so a
# half-raised modem still gets torn down. See dialout-link.example.
#
# link-timeout guards it, because the failure mode of a modem script is not "returns an error", it
# is "sits there" -- and a client wedged on a wwan0 that will never come up has silently left the
# fleet.

link-script=
link-timeout=60

connect-timeout=20

# ----------------------------------------------------------------------------------------------
# server
# ----------------------------------------------------------------------------------------------

state-dir=/var/lib/dialout
# 0.0.0.0 -- the point is to be reachable from outside
bind=0.0.0.0

# Punch the external port with UPnP and keep the lease alive. 0 if the server has a real public
# address, or if the hole is already opened by hand upstream.
upnp=1
upnp-refresh=1800

# How often to re-check that the published DNS still matches the public IP.
dns-refresh=300

# ----------------------------------------------------------------------------------------------
# cloudflare
# ----------------------------------------------------------------------------------------------
#
# Left empty here on purpose -- put the token in dialout.<hostname>.cfg, which is not committed.
# If both are empty the server falls back to iotdata-conf below, purely as a convenience on a box
# that already has one; dialout does not otherwise depend on iotdata in any way. Set iotdata-conf
# empty to sever even that.

cloudflare-token=
# zone id or zone name -- either is accepted
cloudflare-zone=
iotdata-conf=/opt/iotdata/etc/iotdata.conf
